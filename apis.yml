name: Locale
description: >-
  Locale is a no-code workflow automation platform that lets operations, data, and
  engineering teams build, run, and monitor automated workflows without writing
  glue code. Its visual builder chains together apps and actions — HTTP requests,
  AI Actions, run-your-own code, email, Slack, PostgreSQL, Sendgrid, and
  Fireflies.ai — with flow controls such as conditional branching, delays, and list
  iterators, then passes data between steps to orchestrate real business processes.
  Workflows can be built, connected, debugged, and published from the Locale app,
  and the platform positions itself as an operational automation layer for teams
  that want internal alerting and process automation without a heavy engineering
  lift. Locale is backed by a16z. This profile was enriched from Locale's public
  documentation surface (docs.locale.ai); Locale publishes no first-party public
  REST API or OpenAPI at this time.
